; Rustfw colour theme OUTDOOR: the built-in OUTDOOR written out, every key set (docs/theming.md).
; Copy it to \Rustfw\Themes\ and edit the copy: a key left out keeps the base's value.
; The file is refused (the reason shows in a notice) when a contrast or the red rule fails.
[theme]
; format version. A higher number is refused (THEME TOO NEW); 1 today
version = 1
; a label, not shown: THEME lists the file's own name
name = OUTDOOR
; dark, outdoor or light: the built-in the keys left out are taken from
base = outdoor
[metrics]
; height of a field's zone bar, px. Range 4 to 8
zone_bar = 8
; frame round a cell in the page editor, px. Range 1 to 4
frame = 3
; menu row pitch, px; taller rows show fewer rows. Range 44 to 56
menu_row = 44
[colors]
; every screen's background. #RRGGBB
background = #000000
; labels and values. #RRGGBB, at least 4.5:1 on background
text = #FFFFFF
; menu row lines, empty bars. #RRGGBB, at least 3:1 on background
line = #737173
; notes and axes. #RRGGBB, at least 4.5:1 on background
dim = #BDBEBD
; the selected row, banners, frames. #RRGGBB
accent = #FFA600
; text on the accent. #RRGGBB, at least 4.5:1 on accent
on_accent = #000000
; alarm banners, BACK, bad readings. #RRGGBB, at least 4.5:1 on background; the only red, no other key may equal it
alarm = #FF0000
; text on the alarm. #RRGGBB, at least 4.5:1 on alarm
on_alarm = #FFFFFF
; the strip's good dots. #RRGGBB, at least 4.5:1 on background
ok = #00FF00
; the trainer's states. #RRGGBB, at least 4.5:1 on background
warn = #FFFF00
; Ferris. #RRGGBB, at least 3:1 on background
ferris = #F74D00
; the overview's menu cog. #RRGGBB, at least 3:1 on background
cog = #C5C2C5
; the course on the map. #RRGGBB, at least 3:1 on background
course = #CE00FF
; power and heart rate zone 1 (grade, gauge, W' balance too). Zones 1 to 7 must differ
zone1 = #5AC2B5
; power and heart rate zone 2. #RRGGBB, at least 3:1 on background
zone2 = #5AC24A
; power and heart rate zone 3. #RRGGBB, at least 3:1 on background
zone3 = #FFFB63
; power and heart rate zone 4. #RRGGBB, at least 3:1 on background
zone4 = #FFAE52
; power and heart rate zone 5. #RRGGBB, at least 3:1 on background
zone5 = #F74173
; power and heart rate zone 6. #RRGGBB, at least 3:1 on background
zone6 = #8C59F7
; power and heart rate zone 7. #RRGGBB, at least 3:1 on background
zone7 = #7B6D94
