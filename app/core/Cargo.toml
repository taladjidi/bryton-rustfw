[package]
name = "bryton-app-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false
description = "The phone app's Rust core: decodes what the bike computer's GATT server sends; Swift bindings by UniFFI"

# Not a member of the firmware's build: its own lock file and target dir.
[workspace]

[lib]
crate-type = ["lib", "staticlib"]

# The bindgen CLI is built only with `--features bindgen` (build-core.sh), so the iOS builds do not pull in clap.
[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
uniffi = "=0.32.2"
# The firmware's own library, to share its code with the unit (the same bytes on both sides).
bryton-rustfw = { path = "../.." }
fitparser = "0.12.0"
serde_json = "1"
